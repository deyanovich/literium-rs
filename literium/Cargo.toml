[package]
name = "literium"
version = "0.1.0"
edition = "2021"
description = "Version control for literary texts: the atom of change is the sentence (prose) or the line (poetry), not the line of code."
license = "MIT OR Apache-2.0"
repository = "https://gitlab.com/literium/literium-rs"
homepage = "https://literium.org"
readme = "../README.md"
keywords = ["version-control", "text", "literary", "sentence", "unicode"]
categories = ["command-line-utilities", "text-processing"]
exclude = ["CLAUDE.md", "dev/"]

[[bin]]
name = "lit"
path = "src/main.rs"

[lib]
name = "literium"
path = "src/lib.rs"

[dependencies]
# The identity layer (extraction, segmentation, derivation) lives
# in its own crate so that non-VCS consumers (citanda, litorium,
# litodex) can depend on it alone; this crate re-exports it. The
# Unicode 16.0.0 segmentation pin lives there.
literium-core = { path = "../literium-core", version = "0.1.0" }
regex = "1"
# Display bonds (SPEC §7.4 *Bonds*): the .desm file format and its
# overlay. Segmentation never sees it — no `uax29` feature, so the
# Unicode pin stays literium-core's alone.
syndesmos = { version = "0.3", default-features = false }
# The remoting seam (lit account; later clone/pull/push): a
# blocking HTTP client with rustls — no async runtime in a CLI.
ureq = { version = "2", features = ["json"] }
serde_json = "1"
# The exemplar exchange (SPEC §9.7): tar.gz convenience form.
tar = "0.4"
flate2 = "1"
# Project UUIDs for the litorium remote (SYNC.md §6).
getrandom = "0.2"
hex = "0.4"
sha2 = "0.10"

[dev-dependencies]
hex = "0.4"
tempfile = "3"
